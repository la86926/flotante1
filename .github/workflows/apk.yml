name: APK Velocidad YT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalado en el runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar
        working-directory: android-app
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          set -o pipefail
          gradle :app:assembleRelease :fakeyt:assembleDebug --no-daemon 2>&1 | tee $RUNNER_TEMP/build.log

      - name: Guardar error de compilación en la rama ci-build
        if: failure()
        run: |
          mkdir -p cb && cd cb
          grep -nE "error:|e: |warning:.*Lint|FAILED|What went wrong" -A4 $RUNNER_TEMP/build.log | head -150 > errores.txt || true
          tail -80 $RUNNER_TEMP/build.log > final.txt
          git init -q -b ci-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-build

      - name: Verificar APK
        run: |
          APK=android-app/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BT=$ANDROID_HOME/build-tools/35.0.0
          $BT/aapt dump badging "$APK" | grep -F "package: name='com.luis.velyt'"
          $BT/aapt dump badging "$APK" | grep -F "application-label:'Velocidad YT'"
          $BT/apksigner verify --verbose "$APK"
          mkdir -p out
          cp "$APK" out/VelocidadYT.apk
          cp android-app/fakeyt/build/outputs/apk/debug/fakeyt-debug.apk out/fakeyt.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/
          if-no-files-found: error
          retention-days: 30

  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: ['30', '34', '36']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: out

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prueba en emulador Android ${{ matrix.api }}
        id: prueba1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api >= 37 && 'google_apis' || 'default' }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emulator-test.sh out/VelocidadYT.apk out/fakeyt.apk resultados-api${{ matrix.api }}

      # Segundo intento solo si el emulador falló (a veces no arranca en el servidor).
      - name: Reintento en emulador Android ${{ matrix.api }}
        if: steps.prueba1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api >= 37 && 'google_apis' || 'default' }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: rm -rf resultados-api${{ matrix.api }} && bash ci/emulator-test.sh out/VelocidadYT.apk out/fakeyt.apk resultados-api${{ matrix.api }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-api${{ matrix.api }}
          path: resultados-api${{ matrix.api }}/
          retention-days: 30

      - name: Guardar resultados en la rama ci-api${{ matrix.api }}
        if: always()
        run: |
          D=resultados-api${{ matrix.api }}
          mkdir -p "$D"
          echo "${{ github.sha }}" > "$D/commit.txt"
          cd "$D"
          git init -q -b ci-api${{ matrix.api }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Resultados de prueba ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-api${{ matrix.api }}

  # Android 17: su imagen de emulador aún no arranca en GitHub; no frena la publicación.
  test17:
    needs: build
    runs-on: ubuntu-24.04
    # Android 17 depende de que exista su imagen de emulador; no bloquea la publicación.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        api: ['37.0']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: out

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prueba en emulador Android ${{ matrix.api }}
        id: prueba1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api >= 37 && 'google_apis' || 'default' }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emulator-test.sh out/VelocidadYT.apk out/fakeyt.apk resultados-api${{ matrix.api }}

      # Segundo intento solo si el emulador falló (a veces no arranca en el servidor).
      - name: Reintento en emulador Android ${{ matrix.api }}
        if: steps.prueba1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api >= 37 && 'google_apis' || 'default' }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: rm -rf resultados-api${{ matrix.api }} && bash ci/emulator-test.sh out/VelocidadYT.apk out/fakeyt.apk resultados-api${{ matrix.api }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-api${{ matrix.api }}
          path: resultados-api${{ matrix.api }}/
          retention-days: 30

      - name: Guardar resultados en la rama ci-api${{ matrix.api }}
        if: always()
        run: |
          D=resultados-api${{ matrix.api }}
          mkdir -p "$D"
          echo "${{ github.sha }}" > "$D/commit.txt"
          cd "$D"
          git init -q -b ci-api${{ matrix.api }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Resultados de prueba ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-api${{ matrix.api }}

  release:
    needs: [build, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: out
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest out/VelocidadYT.apk \
            --title "Velocidad YT — APK" \
            --notes "APK probado en emulador (Android 11, 14, 16 y 17). Se actualiza con cada cambio." \
            --latest
