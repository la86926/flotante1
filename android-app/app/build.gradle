plugins {
    id 'com.android.application'
}

android {
    namespace 'com.luis.velyt'
    compileSdk 35

    defaultConfig {
        applicationId 'com.luis.velyt'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    // Clave fija solo si existe como secreto en GitHub; si no, clave de prueba.
    def ks = System.getenv('ANDROID_KEYSTORE_FILE')

    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
