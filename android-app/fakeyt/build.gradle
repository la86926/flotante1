// App de PRUEBA que imita el menú de velocidad de YouTube.
// Solo se usa dentro del emulador de GitHub Actions; nunca se publica.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.test.fakeyt'
    compileSdk 35

    defaultConfig {
        applicationId 'com.google.android.youtube'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName 'prueba'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
